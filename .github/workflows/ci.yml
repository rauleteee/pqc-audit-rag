name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --output-format=github"
      - name: ruff format --check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + api extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Run tests
        run: pytest -q
        
  integration:
    name: Integration (Kafka + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pqc
          POSTGRES_PASSWORD: pqc
          POSTGRES_DB: pqc_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqc -d pqc_rag"
          --health-interval 5s --health-timeout 3s --health-retries 10
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s --health-timeout 10s --health-retries 10
    env:
      PQC_RAG_TEST_PG_DSN: postgresql://pqc:pqc@localhost:5432/pqc_rag
      PQC_RAG_TEST_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + api + queue + monitoring extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,queue,monitoring]"
      - name: Run tests against real Kafka and Postgres
        run: pytest -q

  quality-gate:
    name: Retrieval quality gate (MRR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (local embeddings)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local-embed]"
      - name: Cache the ONNX embedding model
        uses: actions/cache@v6
        with:
          path: models
          key: onnx-model-${{ hashFiles('src/pqc_audit_rag/knowledge_base/download_model.py') }}
      - name: Download the embedding model
        run: python -m pqc_audit_rag.knowledge_base.download_model
      - name: Evaluate retrieval (gate)
        run: |
          set -o pipefail
          python evaluation/evaluate_retrieval.py --no-write --min-mrr 0.69 | tee -a "$GITHUB_STEP_SUMMARY"
          
  build:
    name: Build & check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
